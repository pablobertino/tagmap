name: collector

# Recolector TagMap en GitHub Actions: un ciclo cada 15 min (Find Hub → Supabase).
# Secretos requeridos (Settings > Secrets and variables > Actions):
#   SUPABASE_SERVICE_ROLE_KEY   clave service_role del proyecto Naima
#   GFMT_SECRETS_B64            contenido de collector/secrets.json en base64
# Nota: GitHub desactiva los crons tras 60 días sin commits; cualquier push los reactiva.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    env:
      SUPABASE_URL: https://rlaxxavhzrrrmjrkymlm.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GFMT_SECRETS_B64: ${{ secrets.GFMT_SECRETS_B64 }}
      GFMT_REPO_PATH: ./vendor/GoogleFindMyTools
      COLLECTOR_ID: gha-tagmap-1
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/vendor.lock

      - name: Clonar GoogleFindMyTools (commit fijado)
        run: |
          REF=$(cat vendor.lock)
          git clone --quiet https://github.com/leonboe1/GoogleFindMyTools vendor/GoogleFindMyTools
          git -C vendor/GoogleFindMyTools checkout --quiet "$REF"

      - name: Dependencias
        run: |
          pip install -q -r vendor/GoogleFindMyTools/requirements.txt
          pip install -q -r requirements.txt

      - name: Ciclo del recolector
        run: python -m tagmap_collector --once

      - name: Limpiar secretos del runner
        if: always()
        run: rm -f vendor/GoogleFindMyTools/Auth/secrets.json
